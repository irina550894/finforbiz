server {
    listen 80;
    listen [::]:80;
    server_name finforbiz.pro www.finforbiz.pro;

    root /var/www/finforbiz/current;
    index index.html;

    client_max_body_size 1m;

    access_log /var/log/nginx/finforbiz.access.log;
    error_log /var/log/nginx/finforbiz.error.log;

    location /api/contact {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|jpg|jpeg|png|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(mp4)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
